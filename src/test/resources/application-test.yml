# Tests run without external infra: H2 in MariaDB mode + in-memory cache
spring:
  datasource:
    url: jdbc:h2:mem:product_db;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: simple

management:
  health:
    redis:
      enabled: false
