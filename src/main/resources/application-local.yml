# Local development: run `docker compose up -d` first (MariaDB + Redis)
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/product_db
    username: product
    password: product
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.yong831.study: DEBUG
