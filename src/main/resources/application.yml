spring:
  application:
    name: product-service
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "product-service::"

server:
  port: 8080
  shutdown: graceful


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/liveness, /actuator/health/readiness
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
