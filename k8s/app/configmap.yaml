apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
data:
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: jdbc:mariadb://mariadb:3306/product_db
  DB_POOL_SIZE: "10"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # prod uses ddl-auto=validate; "update" lets a fresh cluster create the schema.
  # Switch to validate (and manage schema with Flyway/Liquibase) for real production.
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
