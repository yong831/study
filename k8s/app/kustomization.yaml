apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: product

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: study
    includeSelectors: false

# Override the image per environment, e.g.
#   cd k8s/app && kustomize edit set image product-service=ghcr.io/yong831/product-service:1.0.0
images:
  - name: product-service
    newName: product-service
    newTag: latest
