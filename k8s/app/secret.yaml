# Sample credentials for local clusters only.
# For real environments, create the secret out of band (Sealed Secrets, External Secrets, Vault, ...)
# and remove this file from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secret
type: Opaque
stringData:
  DB_USERNAME: product
  DB_PASSWORD: product
  REDIS_PASSWORD: ""
