# Infra only (for local dev with ./mvnw spring-boot:run):
#   docker compose up -d
# Infra + product-service container:
#   docker compose --profile app up -d --build
services:
  mariadb:
    image: mariadb:11.4
    container_name: product-mariadb
    environment:
      MARIADB_DATABASE: product_db
      MARIADB_USER: product
      MARIADB_PASSWORD: product
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: product-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    profiles: ["app"]
    build: .
    image: product-service:latest
    container_name: product-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mariadb://mariadb:3306/product_db
      DB_USERNAME: product
      DB_PASSWORD: product
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # prod uses ddl-auto=validate; let the demo container create the schema
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadb-data:
